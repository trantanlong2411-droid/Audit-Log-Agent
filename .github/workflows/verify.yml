name: Audit-Log Agent — tests, build and real Pharos Chain MCP
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Date filters, on-chain events, grouped reports and exports
        run: npm test
      - name: Cloudflare Worker dry-run build
        run: npm run build
  live-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify live Mainnet audit event sampling through official Chain MCP
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-log-agent-live-chain-mcp-proof
          path: proof/live-mcp-evidence.json
          retention-days: 30
          if-no-files-found: warn
